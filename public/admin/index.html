<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - EICT S.A.</title>
    <script>window.CMS_MANUAL_INIT = true;</script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@3.1.6/dist/decap-cms.js"></script>
    <script>
      (function() {
        var check = setInterval(function() {
          if (typeof CMS !== 'undefined') {
            clearInterval(check);
            CMS.init({
              config: {
                backend: {
                  name: 'github',
                  repo: 'nightmare3006/EICT-Landing-Page',
                  branch: 'main',
                  base_url: 'https://eict.vercel.app',
                  auth_endpoint: 'api/auth'
                },
                media_folder: 'public/images/uploads',
                public_folder: '/images/uploads',
                publish_mode: 'editorial_workflow',
                site_url: 'https://eict.vercel.app',
                display_url: 'https://eict.vercel.app',
                logo_url: '/logo-eict.svg',
                collections: [
                  {
                    name: 'servicios',
                    label: 'Servicios',
                    folder: 'src/content/servicios',
                    create: true,
                    delete: true,
                    slug: '{{slug}}',
                    fields: [
                      { label: 'T\u00edtulo', name: 'title', widget: 'string', required: true },
                      { label: 'Descripci\u00f3n', name: 'description', widget: 'text', required: true },
                      { label: 'Imagen', name: 'image', widget: 'image', required: false },
                      { label: 'Precio', name: 'price', widget: 'string', required: false },
                      { label: 'Categor\u00eda', name: 'category', widget: 'select', options: ['consultoria', 'cientifico', 'eventos', 'proyectos', 'internacional'], required: true },
                      { label: 'Icono', name: 'icon', widget: 'select', options: ['users', 'flask', 'calendar', 'folder', 'globe'], required: false },
                      { label: 'Información detallada (se muestra al pulsar "Ver más")', name: 'body', widget: 'markdown', required: false },
                      {
                        label: 'Galería de imágenes (se muestra en la ventana de detalle)',
                        name: 'gallery',
                        widget: 'list',
                        required: false,
                        label_singular: 'Imagen',
                        summary: '{{fields.caption}}',
                        fields: [
                          { label: 'Imagen', name: 'image', widget: 'image' },
                          { label: 'Pie de foto', name: 'caption', widget: 'string', required: false }
                        ]
                      },
                      { label: 'Orden', name: 'order', widget: 'number', default: 0, required: false }
                    ]
                  },
                  {
                    name: 'productos',
                    label: 'Productos',
                    folder: 'src/content/productos',
                    create: true,
                    delete: true,
                    slug: '{{slug}}',
                    fields: [
                      { label: 'Nombre', name: 'title', widget: 'string', required: true },
                      { label: 'Descripci\u00f3n', name: 'description', widget: 'text', required: true },
                      { label: 'Imagen', name: 'image', widget: 'image', required: false },
                      { label: 'Precio', name: 'price', widget: 'string', required: false },
                      { label: 'Disponible', name: 'available', widget: 'boolean', default: true },
                      { label: 'Categor\u00eda', name: 'category', widget: 'select', options: ['intangible', 'tecnologia', 'servicio', 'otro'], required: false },
                      { label: 'Contenido', name: 'body', widget: 'markdown', required: false }
                    ]
                  },
                  {
                    name: 'contactos',
                    label: 'Contactos',
                    folder: 'src/content/contactos',
                    create: true,
                    delete: true,
                    slug: '{{slug}}',
                    fields: [
                      {
                        label: '\u00c1rea',
                        name: 'area',
                        widget: 'select',
                        required: true,
                        default: 'presidente',
                        hint: 'Solo define el icono y el color de la tarjeta',
                        options: [
                          { label: 'Presidencia', value: 'presidente' },
                          { label: 'Direcci\u00f3n', value: 'direccion' },
                          { label: 'Departamento Jur\u00eddico', value: 'juridica' },
                          { label: 'Recursos Humanos', value: 'rrhh' },
                          { label: 'Econom\u00eda y Finanzas', value: 'economia' },
                          { label: 'Comercial', value: 'comercial' },
                          { label: 'Proyectos', value: 'proyectos' },
                          { label: 'Otra', value: 'otro' }
                        ]
                      },
                      { label: 'Cargo', name: 'position', widget: 'string', required: true, hint: 'Ej: Presidente. Se usa como t\u00edtulo si no hay nombre' },
                      { label: 'Nombre de la persona', name: 'name', widget: 'string', required: false, hint: 'Opcional: d\u00e9jalo vac\u00edo si a\u00fan no quieres publicarlo' },
                      { label: 'Email', name: 'email', widget: 'string', required: true },
                      { label: 'Tel\u00e9fono', name: 'phone', widget: 'string', required: true },
                      { label: 'Horario', name: 'schedule', widget: 'string', required: false },
                      { label: 'Foto', name: 'photo', widget: 'image', required: false },
                      { label: 'Orden', name: 'order', widget: 'number', default: 0, required: false },
                      { label: 'Descripci\u00f3n', name: 'body', widget: 'markdown', required: false }
                    ]
                  },
                  {
                    name: 'empresa',
                    label: 'Informaci\u00f3n General',
                    files: [
                      {
                        label: 'Sobre Nosotros',
                        name: 'about',
                        file: 'src/content/empresa/about.md',
                        fields: [
                          { label: 'T\u00edtulo', name: 'title', widget: 'string', default: '\u00bfQui\u00e9nes somos?' },
                          { label: 'Contenido', name: 'body', widget: 'markdown' }
                        ]
                      },
                      {
                        label: 'Misi\u00f3n y Visi\u00f3n',
                        name: 'mision-vision',
                        file: 'src/content/empresa/mision-vision.md',
                        fields: [
                          { label: 'Misi\u00f3n', name: 'mision', widget: 'text' },
                          { label: 'Visi\u00f3n', name: 'vision', widget: 'text' },
                          { label: 'Objeto Social', name: 'objeto', widget: 'text' }
                        ]
                      },
                      {
                        label: 'Datos de Contacto',
                        name: 'contacto-general',
                        file: 'src/content/empresa/contacto-general.md',
                        fields: [
                          { label: 'Dirección', name: 'direccion', widget: 'text', required: false },
                          { label: 'Email general', name: 'email_general', widget: 'string', required: false },
                          { label: 'Teléfono principal', name: 'telefono_1', widget: 'string', required: false },
                          { label: 'Teléfono secundario', name: 'telefono_2', widget: 'string', required: false },
                          { label: 'WhatsApp (solo números, con código de país)', name: 'whatsapp', widget: 'string', required: false, hint: 'Ejemplo: 5352117133' },
                          {
                            label: 'Redes sociales',
                            name: 'redes',
                            widget: 'list',
                            required: false,
                            label_singular: 'Red social',
                            summary: '{{fields.plataforma}}',
                            hint: 'Añade solo las redes que ya existan. Las que no añadas no se muestran en la web.',
                            fields: [
                              {
                                label: 'Plataforma',
                                name: 'plataforma',
                                widget: 'select',
                                options: [
                                  { label: 'Facebook', value: 'facebook' },
                                  { label: 'LinkedIn', value: 'linkedin' },
                                  { label: 'Instagram', value: 'instagram' },
                                  { label: 'X (Twitter)', value: 'x' },
                                  { label: 'Threads', value: 'threads' },
                                  { label: 'YouTube', value: 'youtube' },
                                  { label: 'Telegram', value: 'telegram' }
                                ]
                              },
                              {
                                label: 'Enlace',
                                name: 'url',
                                widget: 'string',
                                pattern: ['^https?://.+', 'Debe ser una URL completa que empiece por https://']
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            });
          }
        }, 100);
        setTimeout(function() { clearInterval(check); }, 30000);
      })();
    </script>
  </body>
</html>
